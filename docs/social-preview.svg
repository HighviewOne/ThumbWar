<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Thumb War — a digital thumb wrestling game for Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="p2g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="titleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <g transform="translate(60 60)">
    <rect width="38" height="38" rx="10" fill="#fbbf24"/>
    <text x="19" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22">👍</text>
    <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="2">THUMB WAR</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="290" font-size="130" font-weight="900" fill="url(#titleg)" letter-spacing="-4">THUMB</text>
    <text x="80" y="420" font-size="130" font-weight="900" fill="url(#titleg)" letter-spacing="-4">WAR.</text>
    <text x="86" y="475" font-size="26" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">A digital thumb wrestling game for Android.</text>
    <text x="86" y="510" font-size="22" font-weight="500" fill="#94a3b8">Pin to win — vs AI or two players, same device.</text>

    <g transform="translate(86 545)">
      <rect width="14" height="14" rx="3" fill="#7F52FF"/>
      <text x="22" y="12" font-size="16" font-weight="600" fill="#cbd5e1">Kotlin</text>
      <rect x="84" width="14" height="14" rx="3" fill="#3DDC84"/>
      <text x="106" y="12" font-size="16" font-weight="600" fill="#cbd5e1">Jetpack Compose</text>
      <rect x="260" width="14" height="14" rx="3" fill="#fbbf24"/>
      <text x="282" y="12" font-size="16" font-weight="600" fill="#cbd5e1">Open Source</text>
      <rect x="412" width="14" height="14" rx="3" fill="#ef4444"/>
      <text x="434" y="12" font-size="16" font-weight="600" fill="#cbd5e1">MIT License</text>
    </g>

    <text x="1220" y="610" text-anchor="end" font-size="18" font-weight="600" fill="#64748b" letter-spacing="1">github.com/HighviewOne/ThumbWar</text>
  </g>

  <g transform="translate(990 320)">
    <ellipse cx="0" cy="200" rx="280" ry="26" fill="rgba(0,0,0,0.4)"/>
    <circle cx="0" cy="0" r="240" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 10"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="4 10"/>

    <g transform="translate(-130 -20) rotate(-14)">
      <rect x="-60" y="-118" width="120" height="170" rx="60" fill="url(#p1g)"/>
      <ellipse cx="0" cy="-118" rx="60" ry="42" fill="#fca5a5"/>
      <path d="M -26 -132 Q 0 -152 26 -132" stroke="#7f1d1d" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="-16" cy="-120" r="4" fill="#1f1f1f"/>
      <circle cx="16" cy="-120" r="4" fill="#1f1f1f"/>
      <path d="M -14 -102 Q 0 -90 14 -102" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <g transform="translate(130 20) rotate(14)">
      <rect x="-60" y="-118" width="120" height="170" rx="60" fill="url(#p2g)"/>
      <ellipse cx="0" cy="-118" rx="60" ry="42" fill="#bfdbfe"/>
      <path d="M -26 -132 Q 0 -152 26 -132" stroke="#1e3a8a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="-16" cy="-120" r="4" fill="#1f1f1f"/>
      <circle cx="16" cy="-120" r="4" fill="#1f1f1f"/>
      <path d="M -14 -102 Q 0 -90 14 -102" stroke="#1e3a8a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <g transform="translate(0 -20)">
      <circle r="48" fill="#fbbf24"/>
      <text y="14" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="40" font-weight="900" fill="#0f172a" letter-spacing="2">VS</text>
    </g>
  </g>
</svg>
