<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Thumb War — a digital thumb wrestling game for Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="p2g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="titleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow1)"/>
  <rect width="1280" height="360" fill="url(#glow2)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="84" font-weight="900" fill="url(#titleg)" letter-spacing="-2">THUMB WAR</text>
    <text x="82" y="200" font-size="22" font-weight="600" fill="#cbd5e1" letter-spacing="1">A digital thumb wrestling game for Android.</text>
    <text x="82" y="232" font-size="18" font-weight="500" fill="#94a3b8">Pin to win. Vs AI or two players, same device.</text>
    <g transform="translate(80 270)">
      <rect width="160" height="40" rx="20" fill="#ef4444"/>
      <text x="80" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="white" letter-spacing="1">DOWNLOAD APK</text>
      <rect x="176" width="120" height="40" rx="20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="236" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#cbd5e1" letter-spacing="1">PLAY NOW</text>
    </g>
  </g>

  <g transform="translate(880 180)">
    <ellipse cx="0" cy="120" rx="220" ry="22" fill="rgba(0,0,0,0.35)"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 8"/>

    <g transform="translate(-90 -10) rotate(-12)">
      <rect x="-46" y="-90" width="92" height="130" rx="46" fill="url(#p1g)"/>
      <ellipse cx="0" cy="-90" rx="46" ry="32" fill="#fca5a5"/>
      <path d="M -20 -100 Q 0 -116 20 -100" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-12" cy="-92" r="3" fill="#1f1f1f"/>
      <circle cx="12" cy="-92" r="3" fill="#1f1f1f"/>
      <path d="M -10 -78 Q 0 -70 10 -78" stroke="#7f1d1d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <g transform="translate(90 10) rotate(12)">
      <rect x="-46" y="-90" width="92" height="130" rx="46" fill="url(#p2g)"/>
      <ellipse cx="0" cy="-90" rx="46" ry="32" fill="#bfdbfe"/>
      <path d="M -20 -100 Q 0 -116 20 -100" stroke="#1e3a8a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-12" cy="-92" r="3" fill="#1f1f1f"/>
      <circle cx="12" cy="-92" r="3" fill="#1f1f1f"/>
      <path d="M -10 -78 Q 0 -70 10 -78" stroke="#1e3a8a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <g transform="translate(0 -10)">
      <circle r="34" fill="#fbbf24"/>
      <text y="10" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="2">VS</text>
    </g>
  </g>
</svg>
