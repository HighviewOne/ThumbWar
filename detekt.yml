# Builds on detekt's defaults (buildUponDefaultConfig = true in build.gradle.kts); only the
# deliberate differences are listed here. Any issue fails the build.
build:
  maxIssues: 0

complexity:
  # Composable screens are long, branchy layout trees by nature
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  # Touch handling passes a pointer's full state (id, x, y, pressed, previous, canvas size)
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInClasses: 20

naming:
  # Composables are PascalCase
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  # Matches ktlint's disabled filename rule (.editorconfig)
  MatchingDeclarationName:
    active: false

style:
  # Matches ktlint: wildcard imports are fine for Compose/theme packages (.editorconfig)
  WildcardImport:
    active: false
  # Game tuning, drawing coordinates, colors and haptic timings are clearer inline;
  # shared gameplay values live in GameConfig
  MagicNumber:
    active: false
  # ktlint's default limit
  MaxLineLength:
    maxLineLength: 140
  # Early "nothing to do" returns in update functions
  ReturnCount:
    max: 4
